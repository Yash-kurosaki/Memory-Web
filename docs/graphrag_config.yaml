llm:
  provider: google
  model: gemini-1.5-flash
  api_key: ${GEMINI_API_KEY}

graph_store:
  host: ${TIGERGRAPH_HOST}
  port: ${TIGERGRAPH_PORT}
  graph_name: FinancialCrimeGraph

retriever:
  default: HybridSearch
  top_k: 5
  num_hops: 3
  community_level: 2

chunking:
  strategy: sentence
  chunk_size: 300
  overlap: 30
