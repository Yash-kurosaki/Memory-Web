<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Round 2 GraphRAG benchmark metrics dashboard">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <style>
      .title { font: 700 46px 'Segoe UI', Arial, sans-serif; fill: #f8fafc; }
      .subtitle { font: 500 20px 'Segoe UI', Arial, sans-serif; fill: #cbd5e1; }
      .card-title { font: 600 24px 'Segoe UI', Arial, sans-serif; fill: #e2e8f0; }
      .metric { font: 700 54px 'Segoe UI', Arial, sans-serif; fill: #ffffff; }
      .label { font: 500 18px 'Segoe UI', Arial, sans-serif; fill: #94a3b8; }
      .small { font: 500 16px 'Segoe UI', Arial, sans-serif; fill: #cbd5e1; }
      .ok { fill: #22c55e; }
      .warn { fill: #fbbf24; }
    </style>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="url(#bg)"/>
  <rect x="64" y="56" width="1472" height="2" fill="url(#accent)"/>

  <text x="64" y="120" class="title">Memory-Web Round 2: GraphRAG Results</text>
  <text x="64" y="158" class="subtitle">Financial Crime Intelligence • 30 Scenarios • Dataset: 913,931,776 tokens</text>

  <rect x="64" y="210" width="460" height="190" rx="18" fill="#1e293b" stroke="#334155"/>
  <text x="92" y="258" class="card-title">Token Reduction</text>
  <text x="92" y="330" class="metric">94.7%</text>
  <text x="92" y="365" class="label">GraphRAG vs Basic RAG</text>

  <rect x="570" y="210" width="460" height="190" rx="18" fill="#1e293b" stroke="#334155"/>
  <text x="598" y="258" class="card-title">LLM Judge Pass Rate</text>
  <text x="598" y="330" class="metric">100.0%</text>
  <text x="598" y="365" class="label">30 / 30 scenarios passed</text>

  <rect x="1076" y="210" width="460" height="190" rx="18" fill="#1e293b" stroke="#334155"/>
  <text x="1104" y="258" class="card-title">BERTScore F1 (Raw)</text>
  <text x="1104" y="330" class="metric">0.9299</text>
  <text x="1104" y="365" class="label">Bonus threshold ≥ 0.88</text>

  <rect x="64" y="438" width="1472" height="398" rx="18" fill="#0b1220" stroke="#334155"/>
  <text x="92" y="484" class="card-title">Average Token Usage Per Query</text>

  <text x="92" y="542" class="small">Basic RAG</text>
  <rect x="250" y="518" width="1170" height="38" rx="8" fill="#1f2937"/>
  <rect x="250" y="518" width="1170" height="38" rx="8" fill="#f97316" opacity="0.85"/>
  <text x="1435" y="544" class="small" text-anchor="end">5,649 tokens</text>

  <text x="92" y="622" class="small">GraphRAG</text>
  <rect x="250" y="598" width="1170" height="38" rx="8" fill="#1f2937"/>
  <rect x="250" y="598" width="74" height="38" rx="8" fill="#10b981"/>
  <text x="1435" y="624" class="small" text-anchor="end">360 tokens</text>

  <text x="92" y="702" class="small">LLM-Only</text>
  <rect x="250" y="678" width="1170" height="38" rx="8" fill="#1f2937"/>
  <rect x="250" y="678" width="67" height="38" rx="8" fill="#06b6d4"/>
  <text x="1435" y="704" class="small" text-anchor="end">324 tokens</text>

  <text x="92" y="780" class="small">Cost at 10,000 queries/day: Basic RAG ~$4.31/day vs GraphRAG ~$0.58/day</text>
  <text x="92" y="812" class="small">Estimated annual savings per system: ~$1,369</text>

  <circle cx="1290" cy="785" r="8" class="ok"/>
  <text x="1310" y="791" class="small">Bonus Achieved: Judge ≥90% and BERTScore ≥0.88</text>
</svg>
