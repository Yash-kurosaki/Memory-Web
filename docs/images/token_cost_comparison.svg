<svg width="1400" height="800" viewBox="0 0 1400 800" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Token and cost comparison across pipelines">
  <defs>
    <style>
      .title { font: 700 40px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .label { font: 600 22px 'Segoe UI', Arial, sans-serif; fill: #334155; }
      .value { font: 700 24px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .axis { font: 500 18px 'Segoe UI', Arial, sans-serif; fill: #475569; }
    </style>
  </defs>
  <rect x="0" y="0" width="1400" height="800" fill="#f8fafc"/>
  <text x="70" y="82" class="title">Pipeline Comparison: Tokens and Cost</text>
  <text x="70" y="116" class="axis">Averages from 30 scenarios</text>

  <line x1="180" y1="650" x2="1260" y2="650" stroke="#cbd5e1" stroke-width="2"/>

  <text x="180" y="700" class="label">LLM-Only</text>
  <rect x="180" y="615" width="62" height="35" fill="#06b6d4"/>
  <text x="250" y="640" class="value">324 tokens • $0.000084/query</text>

  <text x="180" y="500" class="label">GraphRAG</text>
  <rect x="180" y="415" width="69" height="35" fill="#10b981"/>
  <text x="260" y="440" class="value">360 tokens • $0.000058/query</text>

  <text x="180" y="300" class="label">Basic RAG</text>
  <rect x="180" y="145" width="1080" height="35" fill="#f97316"/>
  <text x="180" y="130" class="value">5,649 tokens • $0.000431/query</text>

  <rect x="860" y="500" width="400" height="190" rx="14" fill="#e2e8f0"/>
  <text x="890" y="550" class="label">Key Outcome</text>
  <text x="890" y="595" class="value">94.7% token reduction</text>
  <text x="890" y="630" class="value">100.0% judge pass</text>
  <text x="890" y="665" class="value">0.9299 BERTScore F1</text>
</svg>
